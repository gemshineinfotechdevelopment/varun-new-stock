# ==============================================================================
# Nginx Configuration for Varun Traders Stock Maintenance
# Subdomain: varun-traders-stock.gemshine.tech
# Frontend: Vite React SPA (/var/www/varun-stock/dist)
# Backend: Express API (http://127.0.0.1:5013)
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name varun-traders-stock.gemshine.tech;

    # Frontend SPA build directory
    root /var/www/varun-stock/dist;
    index index.html;

    # Max file upload size (Excel stock sheets, product images, documents)
    client_max_body_size 50M;

    # Gzip Compression for fast page loading
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/x-javascript
        application/xml
        application/javascript
        application/json
        image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Frontend React SPA Route Handling
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets Caching (Vite hashed bundles)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    # Backend Express API Proxy to Port 5013
    location /api/ {
        proxy_pass http://127.0.0.1:5013/api/;
        proxy_http_version 1.1;
        
        # WebSockets & Connection headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Timeout settings for long requests (bulk stock import/export/reports)
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Custom Error Pages
    error_page 404 /index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
